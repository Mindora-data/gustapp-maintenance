<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GustApp</title>
<style>
  :root {
    --bg: #F9F7F4;
    --text: #1C1A17;
    --muted: #7A7168;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    max-width: 28rem;
    text-align: center;
  }

  .logo {
    width: 80px;
    height: 80px;
  }

  .message {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  h1 {
    margin: 0;
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.4;
  }

  p {
    margin: 0;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--muted);
  }

  @media (min-width: 640px) {
    .logo {
      width: 96px;
      height: 96px;
    }

    h1 {
      font-size: 1.625rem;
    }

    p {
      font-size: 1.0625rem;
    }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo_gustapp_web.png" alt="GustApp">
    <div class="message">
      <h1>Estamos afinando GustApp.</h1>
      <p>Mientras tanto, puedes leer un buen libro.</p>
      <p>Volvemos muy pronto.</p>
    </div>
  </main>
</body>
</html>
